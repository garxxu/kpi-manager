
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI Manager</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .panel {
      width: min(90%, 400px);
      padding: 35px;
      border-radius: 16px;
      background: #1d293b;
      box-shadow: 0 15px 50px #0005;
    }

    h1 { margin-top: 0; }
    p { color: #aab7c9; }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 15px;
    }

    input {
      background: #101827;
      border: 1px solid #40506a;
      color: white;
    }

    button {
      border: 0;
      background: #26b783;
      color: #071b16;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #40506a;
      color: white;
    }

    #message {
      font-size: 13px;
      margin-top: 15px;
      color: #fca5a5;
    }

    #dashboard { display: none; }
  </style>
</head>

<body>
  <main class="panel">

    <section id="login">
      <h1>KPI Manager</h1>
      <p>Accede a tu panel de rendimiento.</p>

      <form id="loginForm">
        <input
          id="username"
          type="text"
          placeholder="Nombre de usuario"
          autocomplete="username"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="Contraseña"
          autocomplete="current-password"
          required
        >

        <button type="submit">Iniciar sesión</button>
      </form>

      <div id="message"></div>
    </section>

    <section id="dashboard">
      <h1>Bienvenido</h1>
      <p id="userName"></p>
      <p id="userRole"></p>
      <button class="secondary" id="logout">Cerrar sesión</button>
    </section>

  </main>

  <script>
    const SUPABASE_URL = "https://lfgulqzacxlxfnbiqcqe.supabase.co";
    const SUPABASE_KEY = "sb_publishable_1VGaX2VB0LThR4Ntn772Tw_WVu6ZFeL";

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginSection = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");

    async function showDashboard(user) {
      const { data, error } = await client
        .from("profiles")
        .select("full_name, username, role")
        .eq("user_id", user.id)
        .single();

      if (error) {
        message.textContent = "No se pudo cargar tu perfil.";
        return;
      }

      loginSection.style.display = "none";
      dashboard.style.display = "block";

      document.getElementById("userName").textContent =
        "Nombre: " + (data.full_name || data.username);

      document.getElementById("userRole").textContent =
        "Usuario: " + data.username + " | Rol: " + data.role;
    }

    document.getElementById("loginForm").addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        message.textContent = "Comprobando acceso...";

        const username = document
          .getElementById("username")
          .value
          .trim()
          .toLowerCase();

        const password = document.getElementById("password").value;

        if (!/^[a-zA-Z0-9._-]{3,30}$/.test(username)) {
          message.textContent = "Nombre de usuario no válido.";
          return;
        }

        const internalEmail =
          username + "@kpi-empresa.invalid";

        const { data, error } = await client.auth.signInWithPassword({
          email: internalEmail,
          password: password
        });

        if (error) {
          message.textContent =
            "Usuario o contraseña incorrectos.";
          return;
        }

        message.textContent = "";
        await showDashboard(data.user);
      }
    );

    document.getElementById("logout").addEventListener(
      "click",
      async () => {
        await client.auth.signOut();

        dashboard.style.display = "none";
        loginSection.style.display = "block";

        document.getElementById("password").value = "";
        message.textContent = "Sesión cerrada.";
      }
    );

    async function checkSession() {
      const { data } = await client.auth.getSession();

      if (data.session) {
        await showDashboard(data.session.user);
      }
    }

    checkSession();
  </script>
</body>
</html>
